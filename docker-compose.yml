# Development infrastructure this repository owns.
#
# WHY THIS FILE EXISTS
#
# The orchestrator's result cache (docs/09 §4, ADR-028) had been talking to
# whatever happened to be answering on 127.0.0.1:6379. On 2026-08-22 that turned
# out to be another project's container: `edutrack-redis`, holding that
# application's session refresh tokens in the same keyspace as our report cache.
# Nothing collided -- our keys are `sap:v1:*`, theirs `edutrack:*` -- but the two
# applications shared one FLUSHDB, and the dangerous direction was ours: an
# engineer clearing "the cache" while debugging a stale dashboard would have
# signed out every user of an unrelated product.
#
# Sharing was never a decision anyone made; it was the default port being free.
# So this repository now declares the infrastructure it depends on, and binds it
# somewhere that cannot be taken by accident.
#
#   docker compose up -d          (or: npm run infra:up)
#   docker compose down           (or: npm run infra:down)
#
# WHAT IS DELIBERATELY NOT HERE
#
# MySQL. Both databases this platform reads -- `analytics_platform` and the
# `ai_analysis` extract -- live on the host instance at :3306 and hold restored
# ERP dumps that took real effort to obtain. Containerising them would mean
# either re-importing gigabytes into a volume or pointing a container at the
# host's data directory, and neither buys anything: nobody is sharing :3306 by
# accident the way :6379 was. If that changes, add it here rather than in a
# second file.

services:
  redis:
    image: redis:7-alpine
    container_name: sap-redis

    # PORT 6380, not 6379, and that is the entire point of the file. 6379 is the
    # default every Redis on the machine reaches for first, which is exactly how
    # we ended up inside somebody else's instance. Binding away from the default
    # means this project's cache cannot be silently substituted -- if this
    # container is down, REDIS_URL fails to connect and the orchestrator says so
    # once and serves from the replica. A wrong-but-working Redis is worse than
    # an absent one, because it looks fine.
    #
    # Loopback-only. The cache holds school data (docs/09 §4), and 0.0.0.0 would
    # publish a school's rows to every device on the café wifi.
    ports:
      - "127.0.0.1:6380:6379"

    # NO PERSISTENCE, on purpose. A cache that survives a restart is a cache
    # nobody can clear by restarting it, and every entry here is reconstructible
    # by definition -- it is a report the replica can produce again. Turning both
    # RDB snapshots and the AOF off also means school data is never written to a
    # container volume, which is one fewer place for it to outlive its TTL.
    #
    # maxmemory + allkeys-lru because a cache with no eviction policy does not
    # stay small: it grows until Redis starts refusing writes, and then the
    # symptom is dashboards silently missing cache rather than anything that
    # looks like a memory problem. 256mb is far more than this workload needs
    # (a report entry is a few KB); the policy is what matters, not the number.
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru

    # Compose reports "healthy" only once Redis actually answers, so
    # `up --wait` is a real readiness signal rather than "the process started".
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 2s

    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Mailpit -- the local SMTP transport (ADR-035).
  #
  # WHY A CONTAINER AND NOT A REAL MAILBOX
  #
  # ADR-035 draws the credential boundary at the channel row: which schools may
  # send on email is state in the platform DB, but HOW this deployment puts
  # bytes on the wire is process configuration. Locally that configuration
  # points here. Mailpit takes no credentials at all -- no user, no password, no
  # TLS handshake to get wrong -- so developing and demonstrating the email path
  # involves handling no secret whatsoever, which is the property that made it
  # the right local transport rather than a real relay with a test account.
  #
  # It also CANNOT deliver. Every message it accepts stops in its own inbox at
  # :8025 and nothing leaves the machine, so a mistyped address in a flow or a
  # schedule reaches a web UI instead of a real person. That is worth more here
  # than fidelity: the one failure mode a development mail path must not have is
  # actually mailing somebody.
  #
  # WHAT A GREEN RUN AGAINST THIS PROVES, AND WHAT IT DOES NOT
  #
  # It proves the pipeline: guardrails, dedup, template resolution, branch
  # selection, PDF render, attachment, MIME, and the message_log/schedule_
  # deliveries row that records the attempt. It proves NOTHING about
  # deliverability -- Mailpit accepts every address and every envelope, so SPF,
  # DKIM alignment, bounce handling and spam placement stay entirely untested
  # until a production transport is configured (ADR-035, trade-offs).
  mailpit:
    image: axllent/mailpit:latest
    container_name: sap-mailpit

    # PORTS 1026/8026, not Mailpit's own 1025/8025 -- and this is the Redis
    # story above repeating itself, confirmed rather than anticipated. The first
    # `docker compose up` with the defaults failed outright:
    #
    #   Bind for 0.0.0.0:1025 failed: port is already allocated
    #
    # The holder was `edutrack-mailpit`, the same neighbouring project whose
    # Redis this file was written about, published on 0.0.0.0 and healthy for
    # days. A bind conflict is the LUCKY version of that collision: it fails
    # loudly. Had this service come up first, or had that one been bound to a
    # different interface, the two would have shared an inbox -- and a shared
    # inbox is worse than a shared cache, because the thing being mixed together
    # is a Fee Defaulters PDF with children's names in it and somebody else's
    # test mail. Binding away from the default means this project's transport
    # cannot be silently substituted: if this container is down, SMTP_HOST
    # refuses the connection and a delivery records "could not reach the mail
    # server", which is a fact. A wrong-but-working mailbox is not.
    #
    # Loopback-only, both ports, for the reason the Redis note gives: what
    # passes through here is school data, and 0.0.0.0 would publish the inbox,
    # with no authentication in front of it, to every device on the network.
    # (That is precisely how the neighbouring container is published. It is the
    # example, not the model.)
    ports:
      - "127.0.0.1:1026:1025"   # SMTP -- what SMTP_HOST/SMTP_PORT point at
      - "127.0.0.1:8026:8025"   # web inbox -- where a demo actually looks

    environment:
      # Held in memory, never a volume, for the same reason the Redis service
      # runs with persistence off: a received message is school data, and a
      # cache or a mailbox that outlives a restart is one more place for it to
      # sit. `docker compose down` is the whole retention policy.
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

    healthcheck:
      # Mailpit ships its own readiness endpoint; `up --wait` then means "the
      # inbox answers", not "the process started".
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 2s

    restart: unless-stopped
